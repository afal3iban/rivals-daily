# Re-draws the Discord bot's roster pictures (bot/roster/*.jpg) whenever the hero list changes.
name: Roster images
on:
  push:
    branches: [main]
    paths: ['heroes.js', 'bot/roster/index.html', 'bot/roster/render.mjs', '.github/workflows/roster.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install headless browser
        run: npm install --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: Render roster pictures
        run: node bot/roster/render.mjs
      - name: Save pictures to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/roster/*.jpg
          git diff --cached --quiet || (git commit -m "Update roster pictures" && git push)
