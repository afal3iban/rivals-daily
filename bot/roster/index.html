<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rivals Guess roster</title>
<!-- Rendered by .github/workflows/roster.yml into vanguard.jpg / duelist.jpg / strategist.jpg for the Discord bot. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#090c18;--panel:#121a35;--panel2:#1d2850;--line:#2b3768;--text:#eef1ff;--muted:#93a0cc;
    --van:#4aa3ff;--due:#ff5a6e;--str:#3fd18f}
  *{box-sizing:border-box}
  body{margin:0;padding:24px;font-family:'Chakra Petch',system-ui,sans-serif;color:var(--text);background:#05070f;
    display:flex;flex-direction:column;align-items:flex-start;gap:24px}
  .sheet{padding:18px 18px 20px;border-radius:16px;border:1px solid var(--line);
    background:radial-gradient(700px 360px at 0% -20%,#2a1b5e 0%,transparent 60%),
      radial-gradient(700px 360px at 100% -10%,#0d3b57 0%,transparent 55%),var(--bg)}
  .head{display:flex;align-items:center;gap:12px;margin:0 2px 14px}
  .head i{width:14px;height:14px;border-radius:50%;background:var(--rc);box-shadow:0 0 14px var(--rc)}
  .head b{font-size:28px;letter-spacing:4px;text-transform:uppercase}
  .head span{margin-left:auto;color:var(--muted);font-size:16px;letter-spacing:2px;text-transform:uppercase}
  .grid{display:grid;grid-template-columns:repeat(var(--cols),128px);gap:10px}
  .htile{display:flex;flex-direction:column;border-radius:10px;overflow:hidden;background:var(--panel2);
    border:1px solid var(--line)}
  .pic{width:100%;aspect-ratio:1/1.05;overflow:hidden;background:linear-gradient(160deg,#2b2466,#141c3d)}
  .pic img,.pic .ph{width:100%;height:100%;object-fit:cover;object-position:50% 8%;display:block}
  .pic .ph{display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;color:#cdd6ff}
  .nm{height:44px;padding:0 5px;display:flex;align-items:center;justify-content:center;text-align:center;
    font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;line-height:1.1;
    background:rgba(6,9,20,.92);border-top:3px solid var(--rc)}
  .nm.long{font-size:13px;letter-spacing:0}
  .g-van{--rc:var(--van)} .g-due{--rc:var(--due)} .g-str{--rc:var(--str)}
</style>
</head>
<body>
<script src="../../heroes.js"></script>
<script>
function md5(str){
  function rl(n,c){return(n<<c)|(n>>>(32-c));}
  function au(x,y){var l=(x&0xFFFF)+(y&0xFFFF),m=(x>>16)+(y>>16)+(l>>16);return(m<<16)|(l&0xFFFF);}
  function cmn(q,a,b,x,s,t){return au(rl(au(au(a,q),au(x,t)),s),b);}
  function ff(a,b,c,d,x,s,t){return cmn((b&c)|((~b)&d),a,b,x,s,t);}
  function gg(a,b,c,d,x,s,t){return cmn((b&d)|(c&(~d)),a,b,x,s,t);}
  function hh(a,b,c,d,x,s,t){return cmn(b^c^d,a,b,x,s,t);}
  function ii(a,b,c,d,x,s,t){return cmn(c^(b|(~d)),a,b,x,s,t);}
  function utf8(s){return unescape(encodeURIComponent(s));}
  function blk(s){
    var n=((s.length+8)>>6)+1,b=new Array(n*16).fill(0);
    for(var i=0;i<s.length;i++)b[i>>2]|=s.charCodeAt(i)<<((i%4)*8);
    b[i>>2]|=0x80<<((i%4)*8); b[n*16-2]=s.length*8; return b;
  }
  function hex(n){var s='';for(var i=0;i<4;i++)s+=((n>>(i*8+4))&0x0F).toString(16)+((n>>(i*8))&0x0F).toString(16);return s;}
  var x=blk(utf8(str)),a=1732584193,b=-271733879,c=-1732584194,d=271733878;
  for(var i=0;i<x.length;i+=16){
    var oa=a,ob=b,oc=c,od=d;
    a=ff(a,b,c,d,x[i],7,-680876936);d=ff(d,a,b,c,x[i+1],12,-389564586);c=ff(c,d,a,b,x[i+2],17,606105819);b=ff(b,c,d,a,x[i+3],22,-1044525330);
    a=ff(a,b,c,d,x[i+4],7,-176418897);d=ff(d,a,b,c,x[i+5],12,1200080426);c=ff(c,d,a,b,x[i+6],17,-1473231341);b=ff(b,c,d,a,x[i+7],22,-45705983);
    a=ff(a,b,c,d,x[i+8],7,1770035416);d=ff(d,a,b,c,x[i+9],12,-1958414417);c=ff(c,d,a,b,x[i+10],17,-42063);b=ff(b,c,d,a,x[i+11],22,-1990404162);
    a=ff(a,b,c,d,x[i+12],7,1804603682);d=ff(d,a,b,c,x[i+13],12,-40341101);c=ff(c,d,a,b,x[i+14],17,-1502002290);b=ff(b,c,d,a,x[i+15],22,1236535329);
    a=gg(a,b,c,d,x[i+1],5,-165796510);d=gg(d,a,b,c,x[i+6],9,-1069501632);c=gg(c,d,a,b,x[i+11],14,643717713);b=gg(b,c,d,a,x[i],20,-373897302);
    a=gg(a,b,c,d,x[i+5],5,-701558691);d=gg(d,a,b,c,x[i+10],9,38016083);c=gg(c,d,a,b,x[i+15],14,-660478335);b=gg(b,c,d,a,x[i+4],20,-405537848);
    a=gg(a,b,c,d,x[i+9],5,568446438);d=gg(d,a,b,c,x[i+14],9,-1019803690);c=gg(c,d,a,b,x[i+3],14,-187363961);b=gg(b,c,d,a,x[i+8],20,1163531501);
    a=gg(a,b,c,d,x[i+13],5,-1444681467);d=gg(d,a,b,c,x[i+2],9,-51403784);c=gg(c,d,a,b,x[i+7],14,1735328473);b=gg(b,c,d,a,x[i+12],20,-1926607734);
    a=hh(a,b,c,d,x[i+5],4,-378558);d=hh(d,a,b,c,x[i+8],11,-2022574463);c=hh(c,d,a,b,x[i+11],16,1839030562);b=hh(b,c,d,a,x[i+14],23,-35309556);
    a=hh(a,b,c,d,x[i+1],4,-1530992060);d=hh(d,a,b,c,x[i+4],11,1272893353);c=hh(c,d,a,b,x[i+7],16,-155497632);b=hh(b,c,d,a,x[i+10],23,-1094730640);
    a=hh(a,b,c,d,x[i+13],4,681279174);d=hh(d,a,b,c,x[i],11,-358537222);c=hh(c,d,a,b,x[i+3],16,-722521979);b=hh(b,c,d,a,x[i+6],23,76029189);
    a=hh(a,b,c,d,x[i+9],4,-640364487);d=hh(d,a,b,c,x[i+12],11,-421815835);c=hh(c,d,a,b,x[i+15],16,530742520);b=hh(b,c,d,a,x[i+2],23,-995338651);
    a=ii(a,b,c,d,x[i],6,-198630844);d=ii(d,a,b,c,x[i+7],10,1126891415);c=ii(c,d,a,b,x[i+14],15,-1416354905);b=ii(b,c,d,a,x[i+5],21,-57434055);
    a=ii(a,b,c,d,x[i+12],6,1700485571);d=ii(d,a,b,c,x[i+3],10,-1894986606);c=ii(c,d,a,b,x[i+10],15,-1051523);b=ii(b,c,d,a,x[i+1],21,-2054922799);
    a=ii(a,b,c,d,x[i+8],6,1873313359);d=ii(d,a,b,c,x[i+15],10,-30611744);c=ii(c,d,a,b,x[i+6],15,-1560198380);b=ii(b,c,d,a,x[i+13],21,1309151649);
    a=ii(a,b,c,d,x[i+4],6,-145523070);d=ii(d,a,b,c,x[i+11],10,-1120210379);c=ii(c,d,a,b,x[i+2],15,718787259);b=ii(b,c,d,a,x[i+9],21,-343485551);
    a=au(a,oa);b=au(b,ob);c=au(c,oc);d=au(d,od);
  }
  return hex(a)+hex(b)+hex(c)+hex(d);
}
function portraitUrls(name, w){
  w = w || 220;
  const base='https://static.wikia.nocookie.net/marvel-rivals/images/';
  const alt=[name];
  if(name.startsWith('The ')) alt.push(name.slice(4));
  if(name==='Gorr the God Butcher') alt.push('Gorr');
  if(name==='Jeff the Land Shark') alt.push('Jeff');
  if(name==='Rocket Raccoon') alt.push('Rocket');
  if(name==='Cloak & Dagger') alt.push('Cloak and Dagger');
  if(name==='Mister Fantastic') alt.push('Mr. Fantastic');
  const sfx=[' Main Page Portrait.png',' Hero Logo.png'];
  const out=[];
  for(const n of alt) for(const s of sfx){
    const f=(n+s).replace(/ /g,'_');
    const h=md5(f);
    out.push(base+h[0]+'/'+h.slice(0,2)+'/'+encodeURI(f)+'?width='+w);
  }
  return out;
}
function initials(name){
  return name.replace(/^The /,'').split(/[\s&-]+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
}
function portrait(hero, cls, w, waitMs){
  const urls = portraitUrls(hero.name, w);
  const img = document.createElement('img');
  img.alt = hero.name; if(cls) img.className=cls;
  let i = 0, dead = false;
  const giveUp = () => {
    if(dead) return; dead = true;
    const ph = document.createElement('div');
    ph.className = 'ph' + (cls ? ' '+cls : '');
    ph.textContent = initials(hero.name);
    if(img.parentNode) img.replaceWith(ph);
  };
  const next = () => { if(dead) return; i++; (i < urls.length) ? img.src = urls[i] : giveUp(); };
  img.onerror = next;
  img.onload = () => {
    if(dead) return;
    /* the wiki answers a missing file with a wide grey placeholder (ratio ~1.75)
       instead of a 404, so judge it by shape and move to the next candidate. */
    if(img.naturalWidth / img.naturalHeight > 1.4){ next(); return; }
    dead = true;
  };
  setTimeout(() => { if(!img.complete || !img.naturalWidth) giveUp(); }, waitMs || 15000);
  img.src = urls[0];
  return img;
}

const ROLES = [['Vanguard','vanguard','g-van'],['Duelist','duelist','g-due'],['Strategist','strategist','g-str']];
for (const [role, id, cls] of ROLES) {
  const list = HEROES.filter(h => h.roles.includes(role)).sort((a, b) => a.name.localeCompare(b.name));
  const cols = Math.max(4, Math.ceil(Math.sqrt(list.length * 4 / 3)));
  const sheet = document.createElement('section');
  sheet.className = 'sheet ' + cls; sheet.id = id;
  sheet.innerHTML = `<div class="head"><i></i><b>${role}s</b><span>${list.length} heroes</span></div>`;
  const grid = document.createElement('div'); grid.className = 'grid'; grid.style.setProperty('--cols', cols);
  for (const h of list) {
    const t = document.createElement('div'); t.className = 'htile';
    const pic = document.createElement('div'); pic.className = 'pic'; pic.appendChild(portrait(h, '', 256, 45000));
    const nm = document.createElement('div'); nm.className = h.name.length > 15 ? 'nm long' : 'nm'; nm.textContent = h.name;
    t.append(pic, nm); grid.appendChild(t);
  }
  sheet.appendChild(grid); document.body.appendChild(sheet);
}
/* ready when every portrait has either loaded a real image or fallen back to initials */
window.rosterReady = false;
const settled = () => [...document.querySelectorAll('.pic')].every(p => {
  if (p.querySelector('.ph')) return true;
  const im = p.querySelector('img');
  return im && im.complete && im.naturalWidth && im.naturalWidth / im.naturalHeight <= 1.4;
});
const started = Date.now();
(function poll(){ if (settled() || Date.now() - started > 60000) { window.rosterReady = true; } else setTimeout(poll, 300); })();
</script>
</body>
</html>
